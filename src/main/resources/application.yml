spring:
  profiles:
    active: ${SPRING_PROFILE:local}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/risk_radar_db}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:3600000}  # 1 hour in milliseconds

